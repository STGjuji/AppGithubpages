<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ida's Tjenester</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- Web app / PWA meta -->
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ida's tjenester">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#6c5ce7">
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-row">
        <div class="brand">
          <img id="logo" src="images/logo.png" alt="App logo" />
          <h1>Ida's tjenester</h1>
        </div>
        <div class="controls">
          <button id="randomBtn" class="btn">Overrask Mig</button>
          <button id="shuffleBtn" class="btn">Ryst i posen</button>
          <button id="addBtn" class="btn primary">Tilføj Kort</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="filters">
        <label><input type="radio" name="filter" value="all" checked /> Alle</label>
        <label><input type="radio" name="filter" value="available" /> Tilgængelig</label>
        <label><input type="radio" name="filter" value="done" /> Færdig</label>
        <label><input type="radio" name="filter" value="fav" /> Ynglings</label>
        <span id="status" class="status"></span>
      </section>

      <section id="grid" class="grid" aria-live="polite"></section>
    </main>

    <!-- Add/Edit Modal -->
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-panel">
        <h2>Add a favor</h2>
        <form id="favorForm">
          <label>Title<input name="title" required maxlength="80" /></label>
          <label>Description<textarea name="desc" rows="3" maxlength="300"></textarea></label>
          <label>Duration (minutes)<input name="minutes" type="number" min="0" /></label>
          <div class="modal-actions">
            <button type="submit" class="btn primary">Add</button>
            <button type="button" id="cancelBtn" class="btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
